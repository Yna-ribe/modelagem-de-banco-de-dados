<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 1</title>
    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse; 
        }
        th,td{
            padding-bottom: 10px;
        }
        table{width: 50%; 
        border-spacing: 20px;}
        th{
            background-color: azure;
            color:rgb(224, 119, 20);
            text-align: center;

        }
    </style>
</head>
<body>
    <hr>
    <table>
        <!-- linha é feita com a tag <tr> e a coluna com a tag <td> -->
        <tr>
            <th>nome</th>
            <th>idade</th>
            <th>cidade</th>
        </tr>
        <tr>
            <td>José</td>
            <td>19</td>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>23</td>
            <td>Guarulhos</td>
        </tr>

    </table>
</body>
</html>
