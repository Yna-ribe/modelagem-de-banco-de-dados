<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exemplo2</title>
    </head>
    <body>
        <h2>Campos input text</h2>
        <!--deixa dados sensiveis abertos   -->
    <fieldset> 
        <form action="page.html" method="post"autocomplete="on">
            <!-- <label for="pnome">Primeiro nome:</label><br> -->
            <!---trabalhando com o atributo value, que define um valor padrão para o campo de texto--->
            <input type="text" id="pnome" name="pnome" placeholder="digite seu primeiro nome"><br>
            <!--placeholder define um texto de ajuda para o campo de texto-->
            <label for="snome">Sobrenome:</label><br>
            <!--identificador ajuda a localizar no php--->
            <input type="text"id="snome"name="snome" value="Pereira"><br>
            <br>
            <hr>
            <!---para projeto de formulario o "input" é mais recomendado--->
            <h2>Botões de radio</h2>
            <input type="radio" id="male" name="gender1" value="male">
            <label for="male">Masculino</label><br>
            <input type="radio" id="female" name="gender2" value="female">
            <label for="female">Feminino</label><br>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Outros</label><br>
            <hr>
            <h2>Checkbox</h2>
            <!---para checkbox seleciona mais de uma opção--->
            <input type="checkbox"id="vehicle1"name="vehicle1"value="Bike">
            <label for="vehicle1"> Eu tenho uma bicicleta</label><br>
            <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
            <label for="vehicle2">Eu tenho um carro</label><br>
            <input type="checkbox" id="vehicle3" name="vehicle3"value="Boat">
            <label for="vehicle3"> Eu tenho um barco</label><br><br>
            <input type="submit" value="Enviar">
            <!---para type radio seleciona apenas uma opção--->
            <hr>
            <h2>Botões de envio</h2>
            <p>botão input</p>
            <input type="submit" value="Enviar"><br><br>
            <p>botão button</p>
            <button id="botão">Clique aqui</button><br><br>
            <hr>
            <label for="phone">Telefone:</label><br>
            <input type="tel" id="phone" name="phone"placeholder="(11) 99999-9999"
            title="Use o formato (11) 99999-9999"><br>
            <small>Formato: (NN) NNNNN-NNNN</small><br><br>
            <hr>
            <p></p>
            <label for="data-nascimento">Data de Nascimento:</label><br>
            <input type="date" id="data-nascimento" name="data-nascimento"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="exemplo>@dominio.com"><br><br>
        <hr>
        <label for="pin">Pin:</label><br>
        <input type="password" id="pin" name="pin" maxlength="3" size="4"><br><br>
        <hr>
        <label for="brow">Navegador:</label><br>
        <input id="browsers" list="browser" name="browsers" placeholder="Escolha seu navegador">
        <datalist id="browser"
            <option value="Chrome">
            <option value="Firefox">
            <option value="Edge">
            <option value="Opera">
            <option value="Safari">
        </datalist><br><br>
            
        </form>
    </fieldset>
        <hr>
        <p> Em controlestext, o atributo valor padrão 20 quando aplicavel,CSS pode alterar largura visual</p>
    </body>

</html>
